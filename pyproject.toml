[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "airfoil-surrogate"
version = "0.1.0"
description = "ML surrogate for airfoil lift and drag (AirfRANS RANS data), with surrogate-based design optimisation and a stall-extrapolation study"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
airfrans = ["airfrans>=0.1.5"]   # only needed to build the dataset table from the raw simulations
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
